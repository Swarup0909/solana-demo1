# Nginx configuration for Solana Price Monitor
# Place this in /etc/nginx/sites-available/solana-price-monitor
# Then: sudo ln -s /etc/nginx/sites-available/solana-price-monitor /etc/nginx/sites-enabled/

upstream solana_price_monitor {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain

    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;
}

server {
    # listen 443 ssl http2;
    listen 80;  # Change to 443 and uncomment SSL lines after certificate setup
    server_name your-domain.com;  # Replace with your domain

    # SSL Configuration (uncomment after obtaining certificate)
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/solana-price-monitor-access.log;
    error_log /var/log/nginx/solana-price-monitor-error.log;

    # Max body size
    client_max_body_size 10M;

    # Proxy settings
    location / {
        proxy_pass http://solana_price_monitor;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://solana_price_monitor;
        access_log off;
    }
}


